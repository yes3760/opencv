<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <rect width="760" height="440" rx="18" fill="#14040c" stroke="#6ce8aa" stroke-opacity="0.4"/>
  <!-- Window Header -->
  <rect x="0" y="0" width="760" height="32" rx="18" fill="#250917"/>
  <rect x="0" y="16" width="760" height="16" fill="#250917"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="36" cy="16" r="5" fill="#ffbd2e"/><circle cx="52" cy="16" r="5" fill="#27c93f"/>
  <text x="380" y="20" text-anchor="middle" fill="#d9c5b4" font-family="monospace" font-size="11.5">VISION LAB — 08 El jestleri &amp; Pinch Kontrol (Canlı Çıktı Önizleme)</text>

  <!-- Main Canvas -->
  <rect x="16" y="44" width="728" height="350" rx="12" fill="#1d0713" stroke="#f7ecda" stroke-opacity="0.1"/>

  <!-- Left HUD Panel -->
  <rect x="28" y="56" width="246" height="168" rx="12" fill="#100208" fill-opacity="0.92" stroke="#6ce8aa" stroke-opacity="0.4"/>
  <g font-family="monospace" font-size="12">
    <text x="42" y="80" fill="#6ce8aa" font-size="14" font-weight="700">jest: pinch (tutma)</text>
    <text x="42" y="102" fill="#9f8378">ham: pinch</text>
    <text x="42" y="124" fill="#f7ecda">pinch komutu sayısı: 4</text>
    <text x="42" y="152" fill="#f4c97a" font-size="11">12.4 s  pinch_basladi</text>
    <text x="42" y="170" fill="#d9c5b4" font-size="11">10.1 s  pinch_bitti</text>
    <text x="42" y="188" fill="#d9c5b4" font-size="11">08.2 s  pinch_basladi</text>
    <text x="42" y="206" fill="#eba182" font-size="10.5">Histerezis: giriş 0.25 / çıkış 0.40</text>
  </g>

  <!-- 21-Point Hand Skeleton (Pinching!) -->
  <g transform="translate(360, 260)" stroke-linecap="round">
    <!-- Palm & Finger Bones -->
    <g stroke="#6ce8aa" stroke-width="3" fill="none">
      <!-- Wrist (0) to Thumb (1-2-3-4) -->
      <polyline points="0,70 -38,34 -56,-6 -40,-44 -14,-66"/>
      <!-- Wrist (0) to Index (5-6-7-8) -->
      <polyline points="0,70 -18,-10 -22,-54 -14,-74 -4,-70"/>
      <!-- Middle (9-10-11-12) -->
      <polyline points="0,70 10,-14 18,-68 24,-106 28,-132"/>
      <!-- Ring (13-14-15-16) -->
      <polyline points="0,70 36,-4 52,-52 62,-88 68,-112"/>
      <!-- Pinky (17-18-19-20) -->
      <polyline points="0,70 58,14 78,-22 90,-50 98,-72"/>
      <!-- Knuckle bridge -->
      <polyline points="-18,-10 10,-14 36,-4 58,14" stroke-opacity="0.5"/>
    </g>

    <!-- Pinch Glow Ring between 4 & 8 -->
    <circle cx="-9" cy="-68" r="20" fill="#eba182" fill-opacity="0.24" stroke="#eba182" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Key Joint Dots -->
    <circle cx="0" cy="70" r="6" fill="#7cc4fa"/>
    <circle cx="-14" cy="-66" r="6" fill="#eba182"/>
    <circle cx="-4" cy="-70" r="6" fill="#f4c97a"/>
    <g fill="#6ce8aa">
      <circle cx="-38" cy="34" r="4"/><circle cx="-56" cy="-6" r="4"/><circle cx="-40" cy="-44" r="4"/>
      <circle cx="-18" cy="-10" r="4"/><circle cx="-22" cy="-54" r="4"/><circle cx="-14" cy="-74" r="4"/>
      <circle cx="10" cy="-14" r="4"/><circle cx="18" cy="-68" r="4"/><circle cx="28" cy="-132" r="4"/>
      <circle cx="36" cy="-4" r="4"/><circle cx="68" cy="-112" r="4"/><circle cx="58" cy="14" r="4"/><circle cx="98" cy="-72" r="4"/>
    </g>

    <!-- Joint Labels -->
    <text x="12" y="76" fill="#7cc4fa" font-family="monospace" font-size="11" font-weight="700">0: Bilek</text>
    <text x="-112" y="-76" fill="#eba182" font-family="monospace" font-size="11" font-weight="700">4: Başparmak</text>
    <text x="14" y="-66" fill="#f4c97a" font-family="monospace" font-size="11" font-weight="700">8: İşaret (İmleç)</text>
  </g>

  <!-- Right Pinch Gauge & Draggable Box -->
  <rect x="524" y="60" width="204" height="58" rx="10" fill="#100208" stroke="#6ce8aa" stroke-opacity="0.4"/>
  <text x="538" y="80" fill="#d9c5b4" font-family="monospace" font-size="11">Pinch Mesafesi: 0.18 (AKTİF)</text>
  <rect x="538" y="92" width="176" height="12" rx="6" fill="#2c0919"/>
  <rect x="538" y="92" width="52" height="12" rx="6" fill="#6ce8aa"/>
  <line x1="588" y1="88" x2="588" y2="108" stroke="#f4c97a" stroke-width="2"/>
  <line x1="624" y1="88" x2="624" y2="108" stroke="#eba182" stroke-width="2"/>

  <!-- Draggable Box -->
  <rect x="564" y="142" width="136" height="86" rx="12" fill="#6ce8aa" fill-opacity="0.16" stroke="#6ce8aa" stroke-width="2.2"/>
  <text x="632" y="182" text-anchor="middle" fill="#f7ecda" font-family="sans-serif" font-size="13" font-weight="700">Sürüklenen Kutu</text>
  <text x="632" y="202" text-anchor="middle" fill="#6ce8aa" font-family="monospace" font-size="11">Pinch ile taşı!</text>

  <!-- Interactive Volume Slider -->
  <rect x="44" y="330" width="380" height="46" rx="12" fill="#100208" stroke="#f7ecda" stroke-opacity="0.16"/>
  <text x="60" y="348" fill="#d9c5b4" font-family="monospace" font-size="11">ses düzeyi (örnek): %72</text>
  <rect x="60" y="358" width="344" height="8" rx="4" fill="#32091b"/>
  <rect x="60" y="358" width="248" height="8" rx="4" fill="#6ce8aa"/>
  <circle cx="308" cy="362" r="10" fill="#f7ecda" stroke="#6ce8aa" stroke-width="3"/>

  <!-- Bottom Status Bar -->
  <rect x="16" y="402" width="728" height="26" rx="8" fill="#1c352a"/>
  <text x="30" y="419" fill="#6ce8aa" font-family="monospace" font-size="11.5">✓ Sağ el algılandı · İşaret parmağı: çizim · 1 sn açık el: temizle · q: çıkış</text>
</svg>
