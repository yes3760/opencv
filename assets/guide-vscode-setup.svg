    <text x="252" y="136" fill="#555c70">3</text><text x="276" y="136" fill="#ff8fb8">while True:</text>
    <text x="252" y="158" fill="#555c70">4</text><text x="296" y="158" fill="#f7ecda">ok, frame = cap.</text><text x="416" y="158" fill="#6ce8aa">read</text><text x="448" y="158" fill="#f7ecda">()</text>
    <text x="252" y="180" fill="#555c70">5</text><text x="296" y="180" fill="#f7ecda">frame = cv2.</text><text x="388" y="180" fill="#6ce8aa">flip</text><text x="418" y="180" fill="#f7ecda">(frame, </text><text x="478" y="180" fill="#7cc4fa">1</text><text x="486" y="180" fill="#f7ecda">)</text>
    <text x="252" y="202" fill="#555c70">6</text><text x="296" y="202" fill="#f7ecda">cv2.</text><text x="328" y="202" fill="#6ce8aa">imshow</text><text x="374" y="202" fill="#f4c97a">("OpenCV Atolyesi",</text><text x="520" y="202" fill="#f7ecda"> frame)</text>
    <text x="252" y="224" fill="#555c70">7</text><text x="296" y="224" fill="#ff8fb8">if</text><text x="318" y="224" fill="#f7ecda"> cv2.</text><text x="356" y="224" fill="#6ce8aa">waitKey</text><text x="410" y="224" fill="#f7ecda">(1) &amp; 0xFF == </text><text x="516" y="224" fill="#6ce8aa">ord</text><text x="540" y="224" fill="#f4c97a">("q")</text><text x="578" y="224" fill="#f7ecda">: </text><text x="592" y="224" fill="#ff8fb8">break</text>
    <text x="252" y="246" fill="#555c70">8</text><text x="276" y="246" fill="#f7ecda">cap.</text><text x="308" y="246" fill="#6ce8aa">release</text><text x="362" y="246" fill="#f7ecda">(); cv2.</text><text x="424" y="246" fill="#6ce8aa">destroyAllWindows</text><text x="556" y="246" fill="#f7ecda">()</text>
