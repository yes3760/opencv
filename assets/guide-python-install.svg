<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19050e"/>
      <stop offset="100%" stop-color="#2c0919"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22252e"/>
      <stop offset="100%" stop-color="#181b22"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="760" height="460" rx="20" fill="url(#bg)" stroke="#6ce8aa" stroke-opacity="0.3"/>

  <!-- Installer Window -->
  <rect x="34" y="28" width="440" height="310" rx="14" fill="url(#win)" stroke="#ffffff" stroke-opacity="0.14"/>
  <rect x="34" y="28" width="440" height="34" rx="14" fill="#2b2f3a"/>
  <circle cx="56" cy="45" r="5.5" fill="#ff5f56"/>
  <circle cx="74" cy="45" r="5.5" fill="#ffbd2e"/>
  <circle cx="92" cy="45" r="5.5" fill="#27c93f"/>
  <text x="116" y="49" fill="#d9c5b4" font-family="monospace" font-size="12" font-weight="700">Install Python 3.12 (64-bit)</text>

  <!-- Python Logo Badge -->
  <rect x="58" y="80" width="44" height="44" rx="11" fill="#306998"/>
  <text x="80" y="109" text-anchor="middle" fill="#ffd43b" font-family="sans-serif" font-size="22" font-weight="800">Py</text>
  <text x="116" y="99" fill="#f7ecda" font-family="sans-serif" font-size="18" font-weight="700">Python 3.12 Kurulumu</text>
  <text x="116" y="118" fill="#9f8378" font-family="sans-serif" font-size="12">python.org/downloads adresinden indirilir</text>

  <!-- Install Now Box -->
  <rect x="58" y="142" width="392" height="64" rx="10" fill="#243832" stroke="#6ce8aa" stroke-width="2"/>
  <text x="76" y="170" fill="#6ce8aa" font-family="sans-serif" font-size="15" font-weight="700">→ Install Now (Önerilen)</text>
  <text x="76" y="190" fill="#d9c5b4" font-family="sans-serif" font-size="11.5">IDLE, pip ve standart kütüphaneleri otomatik kurar</text>

  <!-- Critical Checkbox Highlight -->
  <rect x="52" y="232" width="404" height="46" rx="10" fill="#6ce8aa" fill-opacity="0.14" stroke="#6ce8aa" stroke-width="2.2" stroke-dasharray="6 4"/>
  <rect x="66" y="245" width="20" height="20" rx="5" fill="#6ce8aa"/>
  <path d="M71 255 l4 4 l7 -8" stroke="#120209" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="98" y="260" fill="#f7ecda" font-family="sans-serif" font-size="14" font-weight="700">Add python.exe to PATH  (MUTLAKA İŞARETLE!)</text>

  <text x="66" y="308" fill="#9f8378" font-family="sans-serif" font-size="11.5">Not: macOS kullanıcıları python.org .pkg veya Homebrew ile kurabilir.</text>

  <!-- Verification Terminal -->
  <rect x="34" y="354" width="692" height="82" rx="12" fill="#0d0207" stroke="#6ce8aa" stroke-opacity="0.45"/>
  <text x="52" y="378" fill="#9f8378" font-family="monospace" font-size="11">TERMINAL DOĞRULAMA (Kurulum sonrası kontrol)</text>
  <text x="52" y="401" fill="#6ce8aa" font-family="monospace" font-size="13.5">$ python3.12 --version   # Windows: py -3.12 --version</text>
  <text x="52" y="422" fill="#f4c97a" font-family="monospace" font-size="13.5">Python 3.12.x   ✓  Ortam kuruluma hazır!</text>

  <!-- Callout Steps on Right -->
  <g transform="translate(500, 42)">
    <rect width="226" height="86" rx="14" fill="#32091b" stroke="#6ce8aa" stroke-opacity="0.5"/>
    <circle cx="24" cy="26" r="13" fill="#6ce8aa"/>
    <text x="24" y="31" text-anchor="middle" fill="#120209" font-family="sans-serif" font-size="13" font-weight="800">1</text>
    <text x="46" y="30" fill="#f7ecda" font-family="sans-serif" font-size="13.5" font-weight="700">Python 3.12 İndir</text>
    <text x="16" y="54" fill="#d9c5b4" font-family="sans-serif" font-size="11.5">MediaPipe paketleri Python</text>
    <text x="16" y="70" fill="#d9c5b4" font-family="sans-serif" font-size="11.5">3.12 ile sorunsuz çalışır.</text>
  </g>

  <g transform="translate(500, 144)">
    <rect width="226" height="90" rx="14" fill="#32091b" stroke="#eba182" stroke-opacity="0.65"/>
    <circle cx="24" cy="26" r="13" fill="#eba182"/>
    <text x="24" y="31" text-anchor="middle" fill="#120209" font-family="sans-serif" font-size="13" font-weight="800">2</text>
    <text x="46" y="30" fill="#f7ecda" font-family="sans-serif" font-size="13.5" font-weight="700">PATH Kutusunu İşaretle</text>
    <text x="16" y="54" fill="#d9c5b4" font-family="sans-serif" font-size="11.5">İşaretlenmezse terminalde</text>
    <text x="16" y="70" fill="#d9c5b4" font-family="sans-serif" font-size="11.5">"python bulunamadı" hatası verir.</text>
  </g>

  <g transform="translate(500, 250)">
    <rect width="226" height="86" rx="14" fill="#32091b" stroke="#6ce8aa" stroke-opacity="0.5"/>
    <circle cx="24" cy="26" r="13" fill="#6ce8aa"/>
    <text x="24" y="31" text-anchor="middle" fill="#120209" font-family="sans-serif" font-size="13" font-weight="800">3</text>
    <text x="46" y="30" fill="#f7ecda" font-family="sans-serif" font-size="13.5" font-weight="700">Sanal Ortam &amp; OpenCV</text>
    <text x="16" y="54" fill="#d9c5b4" font-family="sans-serif" font-size="11.5">venv + pip install ile</text>
    <text x="16" y="70" fill="#d9c5b4" font-family="sans-serif" font-size="11.5">OpenCV &amp; MediaPipe kurulur.</text>
  </g>
</svg>
