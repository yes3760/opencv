<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <rect width="760" height="440" rx="18" fill="#14040c" stroke="#6ce8aa" stroke-opacity="0.4"/>
  <!-- Window Header -->
  <rect x="0" y="0" width="760" height="32" rx="18" fill="#250917"/>
  <rect x="0" y="16" width="760" height="16" fill="#250917"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="36" cy="16" r="5" fill="#ffbd2e"/><circle cx="52" cy="16" r="5" fill="#27c93f"/>
  <text x="380" y="20" text-anchor="middle" fill="#d9c5b4" font-family="monospace" font-size="11.5">VISION LAB — 06 Yuz geometrisi (Canlı Çıktı Önizleme)</text>

  <!-- Camera Feed Area -->
  <rect x="16" y="44" width="444" height="350" rx="12" fill="#1e0814" stroke="#f7ecda" stroke-opacity="0.1"/>
  <!-- Stylized Face Silhouette & 478 Landmark Mesh -->
  <g transform="translate(238, 215)">
    <!-- Face Oval -->
    <ellipse cx="0" cy="0" rx="92" ry="120" fill="#2d0f1e" stroke="#6ce8aa" stroke-width="1.8" stroke-dasharray="5 4"/>
    <!-- Bounding Box -->
    <rect x="-108" y="-132" width="216" height="264" rx="10" fill="none" stroke="#eba182" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="-102" y="-138" fill="#eba182" font-family="monospace" font-size="11" font-weight="700">iz 1 · 478 nokta · 30 FPS</text>

    <!-- Left & Right Eyes (EAR highlighted) -->
    <path d="M-56,-22 Q-34,-36 -12,-22 Q-34,-8 -56,-22 Z" fill="none" stroke="#6ce8aa" stroke-width="2.2"/>
    <path d="M12,-22 Q34,-36 56,-22 Q34,-8 12,-22 Z" fill="none" stroke="#6ce8aa" stroke-width="2.2"/>
    <!-- Vertical & Horizontal EAR Lines -->
    <line x1="-34" y1="-31" x2="-34" y2="-13" stroke="#f4c97a" stroke-width="2"/>
    <line x1="-56" y1="-22" x2="-12" y2="-22" stroke="#7cc4fa" stroke-width="1.5"/>
    <line x1="34" y1="-31" x2="34" y2="-13" stroke="#f4c97a" stroke-width="2"/>
    <line x1="12" y1="-22" x2="56" y2="-22" stroke="#7cc4fa" stroke-width="1.5"/>

    <!-- Nose & Mouth -->
    <polyline points="0,-16 -8,18 0,24 8,18" fill="none" stroke="#6ce8aa" stroke-opacity="0.65" stroke-width="1.4"/>
    <path d="M-32,54 Q0,42 32,54 Q0,70 -32,54 Z" fill="none" stroke="#6ce8aa" stroke-width="1.8"/>

    <!-- Landmark Mesh Dots -->
    <g fill="#6ce8aa">
      <circle cx="-56" cy="-22" r="3"/><circle cx="-12" cy="-22" r="3"/><circle cx="-34" cy="-31" r="3"/><circle cx="-34" cy="-13" r="3"/>
      <circle cx="12" cy="-22" r="3"/><circle cx="56" cy="-22" r="3"/><circle cx="34" cy="-31" r="3"/><circle cx="34" cy="-13" r="3"/>
      <circle cx="0" cy="-118" r="3"/><circle cx="0" cy="118" r="3"/><circle cx="-90" cy="0" r="3"/><circle cx="90" cy="0" r="3"/>
      <circle cx="-32" cy="54" r="3"/><circle cx="32" cy="54" r="3"/><circle cx="0" cy="24" r="3"/>
    </g>
  </g>

  <!-- EAR Formula Pill -->
  <rect x="28" y="346" width="234" height="36" rx="9" fill="#100208" stroke="#f4c97a" stroke-opacity="0.6"/>
  <text x="40" y="368" fill="#f4c97a" font-family="monospace" font-size="11.5" font-weight="700">EAR = dikey / yatay ≈ 0.31</text>

  <!-- Right Live Telemetry Panel (exact style of 06_yuz_geometrisi.py) -->
  <rect x="474" y="44" width="270" height="350" rx="12" fill="#11040a" stroke="#6ce8aa" stroke-opacity="0.35"/>
  <text x="490" y="72" fill="#f7ecda" font-family="sans-serif" font-size="16" font-weight="800">Yüz Geometrisi</text>

  <g font-family="monospace" font-size="12">
    <text x="490" y="102" fill="#6ce8aa" font-weight="700">Kural tabanlı (geometri)</text>
    <text x="490" y="124" fill="#f7ecda">göz açıklığı EAR 0.31</text>
    <text x="686" y="124" fill="#f4c97a" font-weight="700">açık</text>
    <text x="490" y="146" fill="#f7ecda">göz kırpma sayısı: 12</text>
    <text x="490" y="168" fill="#f7ecda">ağız açıklığı 0.14</text>
    <text x="672" y="168" fill="#9f8378">kapalı</text>

    <text x="490" y="204" fill="#6ce8aa" font-weight="700">Öğrenilmiş (blendshape)</text>
    <text x="490" y="226" fill="#d9c5b4">eyeBlinkLeft:  0.08</text>
    <text x="490" y="246" fill="#d9c5b4">eyeBlinkRight: 0.09</text>
    <text x="490" y="266" fill="#d9c5b4">jawOpen:       0.04</text>

    <text x="490" y="302" fill="#6ce8aa" font-weight="700">Baş yönelimi (derece)</text>
    <text x="490" y="324" fill="#f7ecda">yaw +2°  pitch -1°  roll 0°</text>

    <text x="490" y="362" fill="#9f8378" font-size="10.5">Not: Yalnızca hareket ölçülür;</text>
    <text x="490" y="378" fill="#9f8378" font-size="10.5">duygu/kişilik çıkarımı yapılmaz.</text>
  </g>

  <!-- Bottom Status Bar -->
  <rect x="16" y="402" width="728" height="26" rx="8" fill="#1c352a"/>
  <text x="30" y="419" fill="#6ce8aa" font-family="monospace" font-size="11.5">✓ Yüz önden ve dengeli · m: çizim stili (kontur/ağ/nokta) · q: çıkış</text>
</svg>
